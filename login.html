<!DOCTYPE html>
<html>

<head>
    <title>Login - EduPath AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="center">

    <div class="card form-card">

        <h2>🎓 Welcome Back!</h2>

        <p>Login to continue your journey</p>

        <!-- Email -->
        <input
            id="email"
            type="email"
            placeholder="Email / Mobile Number"
        >

        <!-- Password -->
        <input
            id="password"
            type="password"
            placeholder="Enter your password"
        >

        <!-- Remember Me -->
        <label>
            <input type="checkbox">
            Remember me
        </label>

        <!-- Login Button -->
        <button class="btn" onclick="login()">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="#" onclick="signup()">
                Sign Up
            </a>
        </p>

    </div>


    <script>

        function login() {

            let email =
                document.getElementById("email").value;

            if (email === "") {

                alert("Please enter your email");

                return;
            }

            // Save user name
            localStorage.setItem(
                "edupathUser",
                email
            );

            // Login status
            localStorage.setItem(
                "edupathLoggedIn",
                "true"
            );

            // Go to Dashboard
            window.location.href =
                "dashboard.html";
        }


        function signup() {

            alert("Demo account created!");

            login();

        }

    </script>

</body>

</html>
